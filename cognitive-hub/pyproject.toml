[project]
name = "logoskittens-hub"
version = "0.1.0"
description = "LogosKittens cognitive hub"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.10",
  "sqlmodel>=0.0.22",
  "langgraph>=0.2",
  "httpx>=0.27",
  "protobuf>=5",
  "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logoskittens = ["data/*.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
