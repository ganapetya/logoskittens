[project]
name = "bot-link"
version = "0.1.0"
description = "Player sockets for LogosKittens. The hub imports this package."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
